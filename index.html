<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadmap de Cursos & Aprendizado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EA;--card:#FFFFFF;--ink:#2E3A2F;--mut:#6E7C6C;--line:#DCE5D4;
  --s1:#DCE5D4;--s2:#B7C9A0;--s3:#A3B18A;--s4:#6B8E6E;--deep:#2E3A2F;--cream:#EDEAE0;--sand:#C9BFA6;
  --bad-bg:#EBCFC6;--bad:#8C4A3C;--warn-bg:#F2E6BE;--warn:#7A6420;--ok-bg:#DCE5D4;--ok:#4F7552;
  --shadow:0 1px 2px rgba(46,58,47,.06),0 10px 28px rgba(46,58,47,.07);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --s34:#8FA882;--on4:#fff;--hero1:#2E3A2F;--hero2:#3b4d3d;--htx:#C9D6BC;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--s4);outline-offset:2px}
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;padding-top:env(safe-area-inset-top,0px);position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--s3),var(--s2),var(--s3))}
.hero-in{max-width:1240px;margin:0 auto;padding:26px 20px 14px;display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.eyebrow{margin:0 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--htx)}
h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(24px,4vw,38px);line-height:1.1}
h1 em{font-style:italic;color:var(--htx)}
.sub{margin:6px 0 0;color:var(--htx);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-size:11px;color:var(--htx)}
.btn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500}
.btn:hover{background:rgba(255,255,255,.18)}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer}.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:38px;z-index:20;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;min-width:230px;display:flex;flex-direction:column;gap:2px}
.pop button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px;font-size:13px}
.pop button:hover{background:var(--s1)}
.pop small{padding:6px 12px 2px;color:var(--mut)}
.tabs{max-width:1240px;margin:0 auto;padding:0 12px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--htx);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.1)}
.tab[aria-current="page"]{background:var(--s3);color:var(--deep);font-weight:700}
main{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
.demobar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border-bottom:2px solid var(--s4);padding:8px 14px;font-size:13px;text-align:center}.demobar .ghost{padding:4px 12px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 0;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;margin:auto 0 12px;padding-top:4px;color:var(--ink);white-space:nowrap;max-width:100%}
.kpi .bar{height:4px;margin:0 -16px}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.sec h2{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--s4)}
.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--s3),transparent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700}
.tw{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--deep);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:10px 10px;text-align:center;white-space:nowrap}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
td.l,th.l{text-align:left}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--cream) 45%,transparent)}
tr.total td{background:var(--s4)!important;color:var(--on4);font-weight:700;border:0}
.nm{font-weight:700;text-align:left}.nm small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.pbar{display:flex;align-items:center;gap:8px;min-width:120px}
.pbar i{flex:1;height:8px;border-radius:99px;background:var(--s1);overflow:hidden;display:block}
.pbar i b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--s3),var(--s34))}
.pbar span{font-size:12px;font-weight:700;min-width:34px;text-align:right}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.neu{background:var(--cream);color:var(--mut)}
.chip.dark{background:var(--s4);color:var(--on4)}.chip.mid{background:var(--s2);color:var(--ink)}
.mut{color:var(--mut)}.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
.empty{padding:18px;text-align:center;color:var(--mut)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar input,.toolbar select,.f input,.f select,.f textarea,.inl input,.inl select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;min-width:0}
.toolbar .grow{flex:1;min-width:160px}
.pri{border:0;background:var(--s4);color:var(--on4);border-radius:999px;padding:9px 18px;font-weight:700}
.pri:hover{filter:brightness(1.08)}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500}
.ghost:hover{background:var(--s1)}
.ic{border:0;background:none;padding:5px 8px;border-radius:8px;color:var(--mut)}
.ic:hover{background:var(--s1);color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(20,27,21,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}
.modal{background:var(--card);border-radius:20px;max-width:720px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;margin:auto}
.dng{border:1.5px solid var(--bad);background:transparent;color:var(--bad);border-radius:99px;padding:8px 14px;font-weight:700}
.ic.del{color:var(--bad)}
#cdlg .overlay{z-index:120;align-items:center}
#cdlg .cdbox{max-width:440px}#cdlg .cdbox .body{display:block;line-height:1.5}#cdlg .cdbox footer{flex-wrap:wrap}
.modal header{background:var(--hero1);color:#fff;padding:16px 20px;font-family:var(--serif);font-size:18px}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
.f.full{grid-column:1/-1}.f input,.f select,.f textarea{font-weight:400;color:var(--ink)}
.modal footer{padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);background:var(--cream)}
.note{font-size:12px;color:var(--mut);margin:8px 2px 0}
/* gantt */
.gantt{min-width:880px}
.grow-r{display:grid;grid-template-columns:230px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:36px}
.grow-r.cat{background:var(--s4);color:#fff;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;display:block;border-radius:8px;margin-top:8px}
.gname{padding:6px 10px;font-weight:700;font-size:12.5px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:4px;min-width:0}
.gname .gtx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.gname .gbt{white-space:nowrap}.gname .gbt .ic{padding:2px 5px}
.gname small{display:block;grid-column:1/-1;font-weight:400;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:36px;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/12))}
.gbar{position:absolute;top:10px;height:16px;border-radius:99px;background:var(--s3);min-width:6px}
.gbar.done{background:var(--s4)}.gbar.todo{background:var(--s1);border:1px solid var(--s2)}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:rgba(255,255,255,.35)}
.gmk{position:absolute;top:7px;font-size:13px;transform:translateX(-50%);line-height:1}
.gmk.exp{color:var(--bad)}.gmk.prev{color:var(--ink);top:9px}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7}
.ghead{display:grid;grid-template-columns:230px repeat(12,1fr);background:var(--deep);color:#fff;border-radius:12px;font-size:11px;font-weight:700;text-align:center}
.ghead div{padding:9px 2px}.ghead div:first-child{text-align:left;padding-left:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:14px;height:8px;border-radius:99px;margin-right:6px;background:var(--c,var(--s3))}
/* heatmap */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0}
.day{aspect-ratio:1/0.78;border-radius:10px;background:var(--cream);padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mut);position:relative}
.day b{font-size:14px;color:var(--ink)}.day.off{background:transparent}.day.today{outline:2px solid var(--ink)}
.inl{display:flex;gap:8px;align-items:center;justify-content:center}.inl input{width:70px;text-align:center}
.svgbox{width:100%;height:auto;display:block}
.svgbox text{font-family:var(--sans);fill:var(--mut);font-size:11px}
.lgd{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:6px}
.lgd span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.user{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px}
.av{width:26px;height:26px;border-radius:50%;background:var(--s3);color:var(--deep);display:inline-grid;place-items:center;font-weight:700;font-size:12px}
.authwrap{min-height:100vh;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:grid;place-items:center;padding:20px;position:relative}
.atools{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px}
.acard{width:100%;max-width:430px;background:var(--card);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.acard h2{margin:0;font-family:var(--serif);font-size:26px}.acard p{margin:0}
.acard form{display:flex;flex-direction:column;gap:12px}
.acard .f input{padding:11px 13px;font-size:15px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700}
.okm{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);font-weight:400}
.lnk{background:none;border:0;color:var(--s4);text-decoration:underline;padding:4px;font-size:13px;align-self:center}
.palgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.pal{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.pal:hover{border-color:var(--s3)}.pal[aria-pressed="true"]{border-color:var(--s4);box-shadow:0 0 0 3px color-mix(in srgb,var(--s4) 25%,transparent)}
.pal b{font-size:13px}.pal small{color:var(--mut);font-style:italic}
.sw{display:flex;gap:5px}.sw i{flex:1;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.welcome{display:grid;grid-template-columns:1.1fr 1.3fr 1.2fr;gap:14px;margin-bottom:16px}
@media (max-width:1000px){.welcome{grid-template-columns:1fr}}
.welcome>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.welcome>.w-main{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0}
.w-wish{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--htx)}
.w-main h2{margin:4px 0 10px;font-family:var(--serif);font-size:clamp(24px,3.2vw,34px);line-height:1.1}
.w-clock{margin:0;display:flex;flex-direction:column;gap:2px;color:var(--htx)}.w-clock span:first-letter{text-transform:uppercase}
.w-clock b{font-size:32px;color:#fff;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.w-last{margin:12px 0 0;font-size:12px;color:var(--htx)}
.vlab{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--s4)}
.vq{margin:0;font-family:var(--serif);font-size:18px;line-height:1.4}.vref{margin:8px 0 10px;font-weight:700;color:var(--s4)}
.vbtn{display:flex;gap:8px;flex-wrap:wrap}.vbtn .ghost{padding:6px 12px;font-size:12px}
.wxform{display:flex;gap:6px;margin-bottom:8px}.wxform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px}
.wxnow{display:flex;gap:10px;align-items:center}.wxic{font-size:38px}.wxnow b{font-size:28px;font-family:var(--serif)}.wxnow small{display:block;color:var(--mut)}
.wxdays{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px;margin:10px 0 6px}
.wxd{background:var(--cream);border-radius:12px;padding:6px 4px;text-align:center;font-size:11px}.wxd b{display:block}.wxd span{display:block;font-size:18px}.wxd small{display:block;color:var(--mut)}
.lnk2{color:var(--s4);font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.pweek{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.pday{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pday.today{border-color:var(--s4);box-shadow:0 0 0 3px color-mix(in srgb,var(--s4) 22%,transparent)}
.phead{display:flex;justify-content:space-between;font-size:12px}.phead b{font-size:13px}
.pblk{border-left:4px solid var(--c,var(--s3));background:var(--cream);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.pblk.done{background:var(--ok-bg)}.pblk.skip{opacity:.6}
.pt{font-weight:700;color:var(--mut);font-size:11px}.pn{font-weight:700;overflow-wrap:anywhere}.pk{color:var(--mut);font-size:11px}
.pa{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:3px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700}.mini.ok{background:var(--s4);color:var(--on4);border-color:var(--s4)}
.padd{border:1px dashed var(--s3);background:none;border-radius:10px;padding:5px;font-size:11px;color:var(--mut)}
.pempty{font-size:11px;color:var(--mut);text-align:center;padding:6px}.ptot{font-size:11px;color:var(--mut);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--hero1);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:13px;box-shadow:var(--shadow)}.toast.on{opacity:1;transform:translate(-50%,0)}
.msgbox{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-family:var(--sans);font-size:13px;resize:vertical}
.opts{display:grid;gap:8px}.opts label{display:flex;gap:10px;align-items:flex-start;background:var(--cream);padding:10px 12px;border-radius:12px}
.evl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;font-size:12px;margin-top:12px}.evl>div{padding:6px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
@media (max-width:640px){main{padding:16px 10px 50px}.kpi .v{font-size:22px}}
@media print{.hero .tools,.tabs,.toolbar,.ic{display:none!important}}
#bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;pointer-events:none;transition:opacity .3s}
.profile{margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.cover{position:relative;min-height:250px;background:linear-gradient(135deg,var(--hero1),var(--hero2));background-size:cover;background-position:center;color:#fff;padding:20px 22px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.covbtn{position:absolute;right:14px;top:12px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;z-index:2}
.cov-in{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;align-items:center;margin-top:18px}
.cov-l p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.35;font-style:italic;max-width:240px}
.cov-c{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.cov-logo{width:64px;height:64px;border-radius:50%;border:2px solid var(--htx);display:grid;place-items:center;font-family:var(--serif);font-size:24px;margin-bottom:4px}
.cov-c b{letter-spacing:.2em;font-size:15px}.cov-c small{color:var(--htx)}
.cov-words{display:flex;flex-direction:column;font-family:var(--serif);font-size:24px;line-height:1.15;margin-top:8px}.cov-words i{font-style:normal}
.cov-r{text-align:right;font-size:34px;line-height:1.3}
.cov-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.cov-pills span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.06em}
.cov-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--htx)}
.prof-row{display:flex;gap:18px;padding:0 22px 18px;flex-wrap:wrap}
.avatar{width:130px;height:130px;border-radius:50%;margin-top:-52px;border:5px solid var(--card);background:var(--s3) center/cover;color:var(--deep);font-family:var(--serif);font-size:42px;position:relative;box-shadow:var(--shadow);flex:none}
.avatar span{position:absolute;right:0;bottom:4px;background:var(--card);border-radius:50%;width:30px;height:30px;font-size:14px;display:grid;place-items:center;border:1px solid var(--line)}

function hoursFor(name) {

function derive(it) {

}
function donut(vals, cols, labels, center) {
  const tot = vals.reduce((a, b) => a + b, 0), R = 70, C = 2 * Math.PI * R; let off = 0, g = "";

  vals.forEach((v, i) => { if (!v) return; const len = (v / tot) * C;
    g += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${cols[i]}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(labels[i])}: ${v}</title></circle>`; off += len; });
  return `<svg class="svgbox" style="max-width:240px;margin:auto" viewBox="0 0 200 200" role="img" aria-label="Distribuição"><g>${g}</g>
  <text x="100" y="104" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--ink);font-family:var(--serif)">${esc(center)}</text></svg>
  <div class="lgd" style="justify-content:center">${labels.map((s, k) => `<span style="--c:${cols[k]}">${esc(s)} · ${vals[k]}</span>`).join("")}</div>`;
}
function hbars(items, fmt) {
  const max = Math.max(1e-9, ...items.map(i => i.v)), W = 520, rh = 38;
  let g = ""; items.forEach((it, i) => { const y = i * rh + 6, w = (it.v / max) * (W - 190);
    g += `<text x="0" y="${y + 17}">${esc(it.l)}</text><rect x="120" y="${y + 3}" width="${W - 190}" height="16" rx="8" fill="var(--s1)"/><rect x="120" y="${y + 3}" width="${Math.max(it.v ? 4 : 0, w)}" height="16" rx="8" fill="var(--s4)"/><text x="${W - 60}" y="${y + 17}" style="fill:var(--ink);font-weight:700">${fmt(it.v)}</text>`; });
  return `<svg class="svgbox" viewBox="0 0 ${W} ${items.length * rh + 8}" role="img">${g}</svg>`;
}

/* ============ componentes ============ */
const ACC = ["var(--s4)", "var(--s3)", "var(--s2)"];
const kpi = (l, v, i = 0) => `<div class="kpi"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="bar" style="background:${ACC[i % 3]}"></div></div>`;
const sec = t => `<div class="sec"><h2>${esc(t)}</h2></div>`;
const pbar = p => `<div class="pbar"><i><b style="width:${Math.round(p * 100)}%"></b></i><span>${pctS(p)}</span></div>`;
function sitChip(d) {
  if (!d.sit) return "";
  const t = { ativo: ["ok", "● Ativo"], avenc: ["warn", "▲ A vencer"], venc: ["bad", "■ Vencido"], vit: ["neu", "∞ Vitalício"] }[d.sit];
  return `<span class="chip ${t[0]}">${t[1]}${d.dias != null ? " · " + d.dias + " d" : ""}</span>`;
}
function riscoChip(d) {
  const t = { estoura: ["bad", "■ Estoura o acesso"], atraso: ["warn", "▲ Atrasado vs plano"], ok: ["ok", "● No prazo"], done: ["mid", "◆ Concluído"] }[d.risco];
  return t ? `<span class="chip ${t[0]}">${t[1]}</span>` : `<span class="mut">${d.prev === "norate" ? "Sem ritmo" : "—"}</span>`;
}
const stChip = s => ({ "Concluído": "dark", "Em andamento": "mid", "Pausado": "neu", "Não iniciado": "neu" }[s] ? `<span class="chip ${({ "Concluído": "dark", "Em andamento": "mid", "Pausado": "neu", "Não iniciado": "neu" })[s]}">${esc(s)}</span>` : "");

}

function vCat(key) {

function vRoad() {
  const ws = monthStart(S.roadStart), we = new Date(ws.getFullYear(), ws.getMonth() + 12, 1), span = we - ws;
  const pos = d => Math.max(0, Math.min(100, ((d - ws) / span) * 100));
  const months = Array.from({ length: 12 }, (_, i) => new Date(ws.getFullYear(), ws.getMonth() + i, 1));
  const R = rows();
  let body = "";
  CATS.forEach(c => {
    const list = R.filter(r => r.it.cat === c.key); if (!list.length) return;
    body += `<div class="grow-r cat">${esc(c.key)}</div>`;
    list.forEach(r => {
      const it = r.it, d = r.d, s = pd(it.inicio), e = pd(it.termino) || pd(it.venc), v = pd(it.venc);
      let bar = "";
      if (s && e && e >= ws && s < we) { const l = pos(s), w = Math.max(0.6, pos(e) - l); const cls = it.status === "Concluído" ? "done" : it.status === "Em andamento" ? "" : "todo";
        bar = `<div class="gbar ${cls}" style="left:${l}%;width:${w}%" title="${esc(it.name)} · ${fD(s)} → ${fD(e)}"><i style="width:${Math.round(d.pct * 100)}%"></i></div>`; }
      if (v && v >= ws && v < we) bar += `<span class="gmk exp" style="left:${pos(v)}%" title="Vencimento do acesso: ${fD(v)}">▼</span>`;
      if (d.prev instanceof Date && d.prev >= ws && d.prev < we) bar += `<span class="gmk prev" style="left:${pos(d.prev)}%" title="Previsão de término: ${fD(d.prev)}">◆</span>`;
      body += `<div class="grow-r"><div class="gname"><span class="gtx" title="${esc(it.name)}">${esc(it.name)}</span><span class="gbt"><button class="ic" data-act="edit" data-id="${it.id}" title="Editar" aria-label="Editar ${esc(it.name)}">✎</button><button class="ic del" data-act="del" data-id="${it.id}" title="Excluir" aria-label="Excluir ${esc(it.name)}">🗑</button></span><small>${esc(it.status || "")} · ${pctS(d.pct)}</small></div><div class="track">${bar}${TODAY >= ws && TODAY < we ? `<div class="gtoday" style="left:${pos(TODAY)}%"></div>` : ""}</div></div>`;
    });
  });
  return `
  <div class="toolbar"><label class="mut" for="rs">Mês inicial</label><input id="rs" type="month" value="${S.roadStart}" data-set="roadStart"><span class="note" style="margin:0">janela de 12 meses · linha vermelha = hoje</span></div>
  <div class="card"><div class="tw"><div class="gantt">
    <div class="ghead"><div>Item</div>${months.map(m => `<div>${m.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")}/${String(m.getFullYear()).slice(2)}</div>`).join("")}</div>
    ${body || `<div class="empty">Cadastre itens com data de início e término para vê-los aqui.</div>`}
  </div></div>
  <div class="legend"><span style="--c:var(--s3)">Em andamento (preenchimento = % concluído)</span><span style="--c:var(--s4)">Concluído</span><span style="--c:var(--s1)">Não iniciado/pausado</span><span><b class="neg">▼</b> vencimento do acesso</span><span>◆ previsão de término (ritmo real)</span></div></div>`;
}

function csv(catKey) {
  const c = catOf(catKey), f = fieldsOf(c), list = rows().filter(r => r.it.cat === catKey);

}

, e das juntas e medulas, e é apta para discernir os pensamentos e intenções do coração."],["Salmos 55:22","Lança o teu cuidado sobre o SENHOR, e ele te susterá; não permitirá jamais que o justo seja abalado."],["Provérbios 15:16","Melhor é o pouco com o temor do SENHOR, do que um grande tesouro onde há inquietação."],["Salmos 121:2","O meu socorro vem do SENHOR que fez o céu e a terra."],["Provérbios 2:2","Para fazeres o teu ouvido atento à sabedoria; e inclinares o teu coração ao entendimento;"],["Provérbios 11:24","Ao que distribui mais se lhe acrescenta, e ao que retém mais do que é justo, é para a sua perda."],["Provérbios 15:22","Quando não há conselhos os planos se dispersam, mas havendo muitos conselheiros eles se firmam."],["Provérbios 19:21","Muitos propósitos há no coração do homem, porém o conselho do SENHOR permanecerá."],["Salmos 25:1","A TI, SENHOR, levanto a minha alma."],["Provérbios 10:22","A bênção do SENHOR é que enriquece; e não traz consigo dores."],["Salmos 34:7","O anjo do SENHOR acampa-se ao redor dos que o temem, e os livra."],["2 Coríntios 10:5","Destruindo os conselhos, e toda a altivez que se levanta contra o conhecimento de Deus, e levando cativo todo o entendimento à obediência de Cristo;"],["Salmos 84:11","Porque o SENHOR Deus é um sol e escudo; o SENHOR dará graça e glória; não retirará bem algum aos que andam na retidão."],["Salmos 128:1","BEM-AVENTURADO aquele que teme ao SENHOR e anda nos seus caminhos."],["Salmos 46:1","DEUS é o nosso refúgio e fortaleza, socorro bem presente na angústia."],["Apocalipse 21:5","E o que estava assentado sobre o trono disse: Eis que faço novas todas as coisas. E disse-me: Escreve; porque estas palavras são verdadeiras e fiéis."],["Salmos 119:9","Com que purificará o jovem o seu caminho? Observando-o conforme a tua palavra."],["2 Coríntios 4:16","Por isso não desfalecemos; mas, ainda que o nosso homem exterior se corrompa, o interior, contudo, se renova de dia em dia."],["Isaías 58:11","E o SENHOR te "Apega-te à instrução e não a largues; guarda-a, porque ela é a tua vida."],["Provérbios 18:24","O homem de muitos amigos deve mostrar-se amigável, mas há um amigo mais chegado do que um irmão."],["Romanos 5:5","E a esperança não traz confusão, porquanto o amor de Deus está derramado em nossos corações pelo Espírito Santo que nos foi dado."],["2 Coríntios 1:3","Bendito seja o Deus e Pai de nosso Senhor Jesus Cristo, o Pai das misericórdias e o Deus de toda a consolação;"],["Salmos 34:8","Provai, e vede que o SENHOR é bom; bem-aventurado o homem que nele confia."],["Efésios 4:2","Com toda a humildade e mansidão, com longanimidade, suportando-vos uns aos outros em amor,"],["Salmos 27:4","Uma coisa pedi ao SENHOR, e a buscarei: que possa morar na casa do SENHOR todos os dias da minha vida, para contemplar a formosura do SENHOR, e inquirir no seu templo."],["Isaías 26:3","Tu conservarás em paz aquele cuja mente está firme em ti; porque ele confia em ti."],["1 João 4:4","Filhinhos, sois de Deus, e já os tendes vencido; porque maior é o que está em vós do que o que está no mundo."],["Salmos 119:130","A entrada das tuas palavras dá luz, dá entendimento aos símplices."],["Salmos 121:3","Não deixará vacilar o teu pé; aquele que te guarda não tosquenejará."],["Provérbios 21:21","O que segue a justiça e a beneficência achará a vida, a justiça e a honra."],["1 João 1:9","Se confessarmos os nossos pecados, ele é fiel e justo para nos perdoar os pecados, e nos purificar de toda a injustiça."],["Salmos 40:1","ESPEREI com paciência no SENHOR, e ele se inclinou para mim, e ouviu o meu clamor."],["Salmos 61:2","Desde o fim da terra clamarei a ti, quando o meu coração estiver desmaiado; leva-me para a rocha que é mais alta do que eu."],["Salmos 42:1","ASSIM como o cervo brama pelas correntes das águas, assim suspira a minha alma por ti, ó Deus!"],["Salmos 119:97","Oh! quanto amo a tua lei! É a minha meditação em todo o dia."],["Filipenses 1:6","Tendo por certo isto mesmo, que aquele que em vós começou a boa obra a aperfeiçoará até ao dia de Jesus Cristo;"],["Josué 1:9","Não to mandei eu? Esforça-te, e tem bom ânimo; não temas, nem te espantes; porque o SENHOR teu Deus é contigo, por onde quer que andares."],["Romanos 5:4","E a paciência a experiência, e a experiência a esperança."],["Provérbios 14:23","Em todo trabalho há proveito, mas ficar só em palavras leva à pobreza."],["Isaías 40:8","Seca-se a erva, e cai a flor, porém a palavra de nosso Deus subsiste eternamente."],["Mateus 28:20","Ensinando-os a guardar todas as coisas que eu vos tenho mandado; e eis que eu estou convosco todos os dias, até a consumação dos séculos. Amém."],["Salmos 138:3","No dia em que eu clamei, me escutaste; e alentaste com força a minha alma."],["Mateus 6:34","Não vos inquieteis, pois, pelo dia de amanhã, porque o dia de amanhã cuidará de si mesmo. Basta a cada dia o seu mal."],["Provérbios 24:3","Com a sabedoria se edifica a casa, e com o entendimento ela se estabelece;"],["Salmos 121:1","LEVANTAREI os meus olhos para os montes, de onde vem o meu socorro."],["Provérbios 2:1","FILHO meu, se aceitares as minhas palavras, e esconderes contigo os meus mandamentos,"],["Provérbios 16:9","O coração do homem planeja o seu caminho, mas o SENHOR lhe dirige os passos."],["Provérbios 27:17","Como o ferro com ferro se aguça, assim o homem afia o rosto do seu amigo."],["João 8:32","E conhecereis a verdade, e a verdade vos libertará."],["Provérbios 22:1","VALE mais ter um bom nome do que muitas riquezas; e o ser estimado é melhor do que a riqueza e o ouro."],["Isaías 25:1","Ó SENHOR, tu és o meu Deus; exaltar-te-ei, e louvarei o teu nome, porque fizeste maravilhas; os teus conselhos antigos são verdade e firmeza."],["Mateus 6:26","Olhai para as aves do céu, que nem semeiam, nem segam, nem ajuntam em celeiros; e vosso Pai celestial as alimenta. Não tendes vós muito mais valor do que elas?"],["João 15:7","Se vós estiverdes em mim, e as minhas palavras estiverem em vós, pedireis tudo o que quiserdes, e vos será feito."],["Gálatas 5:22","Mas o fruto do Espírito é: amor, gozo, paz, longanimidade, benignidade, bondade, fé, mansidão, temperança."],["Salmos 119:133","Ordena os meus passos na tua palavra, e não se apodere de mim iniqüidade alguma."],["Provérbios 22:4","O galardão da humildade e o temor do SENHOR são riquezas, honra e vida."],["Salmos 112:7","Não temerá maus rumores; o seu coração está firme, confiando no SENHOR."],["Provérbios 20:7","O justo anda na sua sinceridade; bem-aventurados serão os seus filhos depois dele."],["Provérbios 3:6","Reconhece-o em todos os teus caminhos, e ele endireitará as tuas veredas."],["1 Tessalonicenses 5:17","Orai sem cessar."],["Eclesiastes 3:11","Tudo fez formoso em seu tempo; também pôs o mundo no coração do homem, sem que este possa descobrir a obra que Deus fez desde o princípio até ao fim."],["Provérbios 9:10","O temor do SENHOR é o princípio da sabedoria, e o conhecimento do Santo a prudência."],["Isaías 26:4","Confiai no SENHOR perpetuamente; porque o SENHOR DEUS é uma rocha eterna."],["Isaías 46:4","E até à velhice eu serei o mesmo, e ainda até às cãs eu vos carregarei; eu vos fiz, e eu vos levarei, e eu vos trarei, e vos livrarei."],["Provérbios 4:25","Os teus olhos olhem para a frente, e as tuas pálpebras olhem direto diante de ti."],["1 Pedro 5:7","Lançando sobre ele toda a vossa ansiedade, porque ele tem cuidado de vós."],["1 Timóteo 4:12","Ninguém despreze a tua mocidade; mas sê o exemplo dos fiéis, na palavra, no trato, no amor, no espírito, na fé, na pureza."],["João 3:16","Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna."],["Tiago 1:5","E, se algum de vós tem falta de sabedoria, peça-a a Deus, que a todos dá liberalmente, e o não lança em rosto, e ser-lhe-á dada."],["Salmos 16:11","Far-me-ás ver a vereda da vida; na tua presença há fartura de alegrias; à tua mão direita há delícias perpetuamente."],["Josué 1:8","Não se aparte da tua boca o livro desta lei; antes medita nele dia e noite, para que tenhas cuidado de fazer conforme a tudo quanto nele está escrito; porque então farás prosperar o teu caminho, e serás bem sucedido."],["Mateus 17:20","E Jesus lhes disse: Por causa de vossa pouca fé; porque em verdade vos digo que, se tiverdes fé como um grão de mostarda, direis a este monte: Passa daqui para acolá, e há de passar; e nada vos será impossível."],["Provérbios 1:7","O temor do SENHOR é o princípio do conhecimento; os loucos desprezam a sabedoria e a instrução."],["Mateus 11:28","Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei."],["Romanos 6:23","Porque o salário do pecado é a morte, mas o dom gratuito de Deus é a vida eterna, por Cristo Jesus nosso Senhor."],["Colossenses 3:2","Pensai nas coisas que são de cima, e não nas que são da terra;"],["Jeremias 29:11","Porque eu bem sei os pensamentos que tenho a vosso respeito, diz o SENHOR; pensamentos de paz, e não de mal, para vos dar o fim que esperais."],["Lamentações 3:22","As misericórdias do SENHOR são a causa de não sermos consumidos, porque as suas misericórdias não têm fim;"],["Colossenses 2:3","Em quem estão escondidos todos os tesouros da sabedoria e da ciência."],["1 Coríntios 15:58","Portanto, meus amados irmãos, sede firmes e constantes, sempre abundantes na obra do Senhor, sabendo que o vosso trabalho não é vão no Senhor."],["Provérbios 14:30","O sentimento sadio é vida para o corpo, mas a inveja é podridão para os ossos."],["Provérbios 3:7","Não sejas sábio a teus próprios olhos; teme ao SENHOR e aparta-te do mal."],["Romanos 12:1","ROGO-VOS, pois, irmãos, pela compaixão de Deus, que apresenteis os vossos corpos em sacrifício vivo, santo e agradável a Deus, que é o vosso culto racional."],["Salmos 118:6","O SENHOR está comigo; não temerei o que me pode fazer o homem."],["2 Tessalonicenses 3:13","E vós, irmãos, não vos canseis de fazer o bem."],["Hebreus 10:23","Retenhamos firmes a confissão da nossa esperança; porque fiel é o que prometeu."],["Romanos 8:31","Que diremos, pois, a estas coisas? Se Deus é por nós, quem será contra nós?"],["Isaías 55:9","Porque assim como os céus são mais altos do que a terra, assim são os meus caminhos mais altos do que os vossos caminhos, e os meus pensamentos mais altos do que os vossos pensamentos."],["Provérbios 3:5","Confia no SENHOR de todo o teu coração, e não te estribes no teu próprio entendimento."],["Deuteronômio 31:6","Esforçai-vos, e animai-vos; não temais, nem vos espanteis diante deles; porque o SENHOR teu Deus é o que vai contigo; não te deixará nem te desamparará."],["Isaías 32:17","E o efeito da justiça será paz, e a operação da justiça, repouso e segurança para sempre."],["Eclesiastes 4:9","Melhor é serem dois do que um, porque têm melhor paga do seu trabalho."],["Provérbios 16:3","Confia ao SENHOR as tuas obras, e teus pensamentos serão estabelecidos."],["Eclesiastes 3:1","TUDO tem o seu tempo determinado, e há tempo para todo o propósito debaixo do céu."],["Salmos 56:3","Em qualquer tempo em que eu temer, confiarei em ti."],["Salmos 34:18","Perto está o SENHOR dos que têm o coração quebrantado, e salva os contritos de espírito."],["Salmos 116:1","AMO ao SENHOR, porque ele ouviu a minha voz e a minha súplica."],["João 16:24","Até agora nada pedistes em meu nome; pedi, e recebereis, para que o vosso gozo se cumpra."],["Salmos 50:15","E invoca-me no dia da angústia; eu te livrarei, e tu me glorificarás."],["Provérbios 18:12","O coração do homem se exalta antes de ser abatido e diante da honra vai a humildade."],["1 Coríntios 16:13","Vigiai, estai firmes na fé; portai-vos varonilmente, e fortalecei-vos."],["Salmos 25:4","Faze-me saber os teus caminhos, SENHOR; ensina-me as tuas veredas."],["Salmos 119:50","Isto é a minha consolação na minha aflição, porque a tua palavra me vivificou."],["Hebreus 4:16","Cheguemos, pois, com confiança ao trono da graça, para que possamos alcançar misericórdia e achar graça, a fim de sermos ajudados em tempo oportuno."],["Hebreus 11:1","ORA, a fé é o firme fundamento das coisas que se esperam, e a prova das coisas que se não vêem."],["João 6:35","E Jesus lhes disse: Eu sou o pão da vida; aquele que vem a mim não terá fome, e quem crê em mim nunca terá sede."],["2 Timóteo 4:7","Combati o bom combate, acabei a carreira, guardei a fé."],["2 Timóteo 3:16","Toda a Escritura é divinamente inspirada, e proveitosa para ensinar, para redargüir, para corrigir, para instruir em justiça;"],["Provérbios 10:12","O ódio excita contendas, mas o amor cobre todos os pecados."],["Salmos 73:26","A minha carne e o meu coração desfalecem; mas Deus é a fortaleza do meu coração, e a minha porção para sempre."],["Salmos 16:8","Tenho posto o SENHOR continuamente diante de mim; por isso que ele está à minha mão direita, nunca vacilarei."],["Salmos 146:5","Bem-aventurado aquele que tem o Deus de Jacó por seu auxílio, e cuja esperança está posta no SENHOR seu Deus."],["Salmos 127:1","SE o SENHOR não edificar a casa, em vão trabalham os que a edificam; se o SENHOR não guardar a cidade, em vão vigia a sentinela."],["Filipenses 3:14","Prossigo para o alvo, pelo prêmio da soberana vocação de Deus em Cristo Jesus."],["Salmos 119:105","Lâmpada para os meus pés é tua palavra, e luz para o meu caminho."],["Provérbios 15:1","A RESPOSTA branda desvia o furor, mas a palavra dura suscita a ira."],["Salmos 68:19","Bendito seja o Senhor, que de dia em dia nos carrega de benefícios; o Deus que é a nossa salvação. (Selá.)"],["1 Coríntios 10:13","Não veio sobre vós tentação, senão humana; mas fiel é Deus, que não vos deixará tentar acima do que podeis, antes com a tentação dará também o escape, para que a possais suportar."],["Salmos 94:19","Na multidão dos meus pensamentos dentro de mim, as tuas consolações recrearam a minha alma."],["Provérbios 16:24","As palavras suaves são favos de mel, doces para a alma, e saúde para os ossos."],["Isaías 30:21","E os teus ouvidos ouvirão a palavra do que está por detrás de ti, dizendo: Este é o caminho, andai nele, sem vos desviardes nem para a direita nem para a esquerda."],["2 Coríntios 9:7","Cada um contribua segundo propôs no seu coração; não com tristeza, ou por necessidade; porque Deus ama ao que dá com alegria."],["2 Timóteo 2:15","Procura apresentar-te a Deus aprovado, como obreiro que não tem de que se envergonhar, que maneja bem a palavra da verdade."],["Gálatas 6:9","E não nos cansemos de fazer bem, porque a seu tempo ceifaremos, se não houvermos desfalecido."],["Salmos 31:24","Esforçai-vos, e ele fortalecerá o vosso coração, vós todos que esperais no SENHOR."],["Salmos 37:4","Deleita-te também no SENHOR, e te concederá os desejos do teu coração."],["Jeremias 33:3","Clama a mim, e responder-te-ei, e anunciar-te-ei coisas grandes e firmes que não sabes."],["João 15:12","O meu mandamento é este: Que vos ameis uns aos outros, assim como eu vos amei."],["Provérbios 13:22","O homem de bem deixa uma herança aos filhos de seus filhos, mas a riqueza do pecador é depositada para o justo."],["Colossenses 3:17","E, quanto fizerdes por palavras ou por obras, fazei tudo em nome do Senhor Jesus, dando por ele graças a Deus Pai."],["Provérbios 2:3","Se clamares por conhecimento, e por inteligência alçares a tua voz,"],["Salmos 138:8","O SENHOR aperfeiçoará o que me toca; a tua benignidade, ó SENHOR, dura para sempre; não desampares as obras das tuas mãos."],["Provérbios 21:5","Os pensamentos do diligente tendem só para a abundância, porém os de todo apressado, tão-somente para a pobreza."],["Salmos 42:11","Por que estás abatida, ó minha alma, e por que te perturbas dentro de mim? Espera em Deus, pois ainda o louvarei, o qual é a salvação da minha face, e o meu Deus."],["Salmos 33:18","Eis que os olhos do SENHOR estão sobre os que o temem, sobre os que esperam na sua misericórdia;"],["Salmos 147:3","Sara os quebrantados de coração, e lhes ata as suas feridas."],["Colossenses 3:16","A palavra de Cristo habite em vós abundantemente, em toda a sabedoria, ensinando-vos e admoestando-vos uns aos outros, com salmos, hinos e cânticos espirituais, cantando ao SENHOR com graça em vosso coração."],["Mateus 7:7","Pedi, e dar-se-vos-á; buscai, e encontrareis; batei, e abrir-se-vos-á."],["Provérbios 15:13","O coração alegre aformoseia o rosto, mas pela dor do coração o espírito se abate."],["João 11:25","Disse-lhe Jesus: Eu sou a ressurreição e a vida; quem crê em mim, ainda que esteja morto, viverá;"],["Isaías 54:17","Toda a ferramenta preparada contra ti não prosperará, e toda a língua que se levantar contra ti em juízo tu a condenarás; esta é a herança dos servos do SENHOR, e a sua justiça que de mim procede, diz o SENHOR."],["Romanos 5:3","E não somente isto, mas também nos gloriamos nas tribulações; sabendo que a tribulação produz a paciência,"],["Tiago 4:7","Sujeitai-vos, pois, a Deus, resisti ao diabo, e ele fugirá de vós."],["Tiago 3:17","Mas a sabedoria que do alto vem é, primeiramente pura, depois pacífica, moderada, tratável, cheia de misericórdia e de bons frutos, sem parcialidade, e sem hipocrisia."],["Salmos 37:24","Ainda que caia, não ficará prostrado, pois o SENHOR o sustém com a sua mão."],["Mateus 22:37","E Jesus disse-lhe: Amarás o Senhor teu Deus de todo o teu coração, e de toda a tua alma, e de todo o teu pensamento."],["Tiago 1:17","Toda a boa dádiva e todo o dom perfeito vem do alto, descendo do Pai das luzes, em quem não há mudança nem sombra de variação."],["Isaías 9:6","Porque um menino nos nasceu, um filho se nos deu, e o principado está sobre os seus ombros, e se chamará o seu nome: Maravilhoso, Conselheiro, Deus Forte, Pai da Eternidade, Príncipe da Paz."],["Provérbios 23:12","Aplica o teu coração à instrução e os teus ouvidos às palavras do conhecimento."],["Provérbios 24:4","E pelo conhecimento se encherão as câmaras com todos os bens preciosos e agradáveis."],["1 João 4:18","No amor não há temor, antes o perfeito amor lança fora o temor; porque o temor tem consigo a pena, e o que teme não é perfeito em amor."],["Salmos 103:8","Misericordioso e piedoso é o SENHOR; longânimo e grande em benignidade."],["Provérbios 3:1","FILHO meu, não te esqueças da minha lei, e o teu coração guarde os meus mandamentos."],["João 14:27","Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá. Não se turbe o vosso coração, nem se atemorize."],["Salmos 20:5","Nós nos alegraremos pela tua salvação, e em nome do nosso Deus arvoraremos pendões; cumpra o SENHOR todas as tuas petições."],["Salmos 124:8","O nosso socorro está no nome do SENHOR, que fez o céu e a terra."],["Provérbios 3:27","Não deixes de fazer bem a quem o merece, estando em tuas mãos a capacidade de fazê-lo."],["Salmos 91:2","Direi do SENHOR: Ele é o meu Deus, o meu refúgio, a minha fortaleza, e nele confiarei."],["Efésios 6:10","No demais, irmãos meus, fortalecei-vos no Senhor e na força do seu poder."],["Salmos 118:24","Este é o dia que fez o SENHOR; regozijemo-nos, e alegremo-nos nele."],["Tiago 1:4","Tenha, porém, a paciência a sua obra perfeita, para que sejais perfeitos e completos, sem faltar em coisa alguma."],["Mateus 10:31","Não temais, pois; mais valeis vós do que muitos passarinhos."],["Efésios 4:32","Antes sede uns para com os outros benignos, misericordiosos, perdoando-vos uns aos outros, como também Deus vos perdoou em Cristo."],["Salmos 23:2","Deitar-me faz em verdes pastos, guia-me mansamente a águas tranqüilas."],["Salmos 20:4","Conceda-te conforme ao teu coração, e cumpra todo o teu plano."],["2 Coríntios 5:7","(Porque andamos por fé, e não por vista)."],["Salmos 119:11","Escondi a tua palavra no meu coração, para eu não pecar contra ti."],["1 Coríntios 1:9","Fiel é Deus, pelo qual fostes chamados para a comunhão de seu Filho Jesus Cristo nosso Senhor."],["Marcos 9:23","E Jesus disse-lhe: Se tu podes crer, tudo é possível ao que crê."],["Tiago 4:8","Chegai-vos a Deus, e ele se chegará a vós. Alimpai as mãos, pecadores; e, vós de duplo ânimo, purificai os corações."],["Provérbios 8:11","Porque melhor é a sabedoria do que os rubis; e tudo o que mais se deseja não se pode comparar com ela."],["Provérbios 12:1","O QUE ama a instrução ama o conhecimento, mas o que odeia a repreensão é estúpido."],["Gálatas 5:1","ESTAI, pois, firmes na liberdade com que Cristo nos libertou, e não torneis a colocar-vos debaixo do jugo da servidão."],["Mateus 5:14","Vós sois a luz do mundo; não se pode esconder uma cidade edificada sobre um monte;"],["Provérbios 16:32","Melhor é o que tarda em irar-se do que o poderoso, e o que controla o seu ânimo do que aquele que toma uma cidade."],["Lucas 11:9","E eu vos digo a vós: Pedi, e dar-se-vos-á; buscai, e achareis; batei, e abrir-se-vos-á;"],["Salmos 63:1","Ó DEUS, tu és o meu Deus, de madrugada te buscarei; a minha alma tem sede de ti; a minha carne te deseja muito em uma terra seca e cansada, onde não há água;"],["Romanos 12:12","Alegrai-vos na esperança, sede pacientes na tribulação, perseverai na oração;"],["Provérbios 18:10","Torre forte é o nome do SENHOR; a ela correrá o justo, e estará em alto refúgio."],["Provérbios 12:25","A ansiedade no coração deixa o homem abatido, mas uma boa palavra o alegra."],["Provérbios 3:9","Honra ao SENHOR com os teus bens, e com a primeira parte de todos os teus ganhos;"],["Provérbios 17:17","Em todo o tempo ama o amigo e para a hora da angústia nasce o irmão."],["Hebreus 13:5","Sejam vossos costumes sem avareza, contentando-vos com o que tendes; porque ele disse: Não te deixarei, nem te desampararei."],["Hebreus 10:35","Não rejeiteis, pois, a vossa confiança, que tem grande e avultado galardão."],["1 Tessalonicenses 5:18","Em tudo dai graças, porque esta é a vontade de Deus em Cristo Jesus para convosco."],["Provérbios 29:18","Não havendo profecia, o povo perece; porém o que guarda a lei, esse é bem-aventurado."],["Salmos 29:11","O SENHOR dará força ao seu povo; o SENHOR abençoará o seu povo com paz."],["Isaías 40:31","Mas os que esperam no SENHOR renovarão as forças, subirão com asas como águias; correrão, e não se cansarão; caminharão, e não se fatigarão."],["1 Coríntios 16:14","Todas as vossas coisas sejam feitas com amor."],["Provérbios 25:11","Como maçãs de ouro em salvas de prata, assim é a palavra dita a seu tempo."],["Mateus 5:6","Bem-aventurados os que têm fome e sede de justiça, porque eles serão fartos;"],["Salmos 28:7","O SENHOR é a minha força e o meu escudo; nele confiou o meu coração, e fui socorrido; assim o meu coração salta de prazer, e com o meu canto o louvarei."],["1 João 5:14","E esta é a confiança que temos nele, que, se pedirmos alguma coisa, segundo a sua vontade, ele nos ouve."],["Filipenses 4:7","E a paz de Deus, que excede todo o entendimento, guardará os vossos corações e os vossos sentimentos em Cristo Jesus."],["Provérbios 31:25","A força e a honra são seu vestido, e se alegrará com o dia futuro."],["Salmos 23:4","Ainda que eu andasse pelo vale da sombra da morte, não temeria mal algum, porque tu estás comigo; a tua vara e o teu cajado me consolam."],["Efésios 6:11","Revesti-vos de toda a armadura de Deus, para que possais estar firmes contra as astutas ciladas do diabo."],["Romanos 13:10","O amor não faz mal ao próximo. De sorte que o cumprimento da lei é o amor."],["Romanos 12:9","O amor seja não fingido. Aborrecei o mal e apegai-vos ao bem."],["Apocalipse 3:20","Eis que estou à porta, e bato; se alguém ouvir a minha voz, e abrir a porta, entrarei em sua casa, e com ele cearei, e ele comigo."],["Salmos 133:1","OH! quão bom e quão suave é que os irmãos vivam em união."],["Colossenses 1:10","Para que possais andar dignamente diante do Senhor, agradando-lhe em tudo, frutificando em toda a boa obra, e crescendo no conhecimento de Deus;"],["Romanos 8:26","E da mesma maneira também o Espírito ajuda as nossas fraquezas; porque não sabemos o que havemos de pedir como convém, mas o mesmo Espírito intercede por nós com gemidos inexprimíveis."],["Deuteronômio 8:18","Antes te lembrarás do SENHOR teu Deus, que ele é o que te dá força para adquirires riqueza; para confirmar a sua aliança, que jurou a teus pais, como se vê neste dia."],["Romanos 8:18","Porque para mim tenho por certo que as aflições deste tempo presente não são para comparar com a glória que em nós há de ser revelada."],["Provérbios 19:8","O que adquire entendimento ama a sua alma; o que cultiva a inteligência achará o bem."],["Provérbios 3:13","Bem-aventurado o homem que acha sabedoria, e o homem que adquire conhecimento;"],["Atos dos Apóstolos 1:8","Mas recebereis a virtude do Espírito Santo, que há de vir sobre vós; e ser-me-eis testemunhas, tanto em Jerusalém como em toda a Judéia e Samaria, e até aos confins da terra."],["Romanos 12:2","E não sede conformados com este mundo, mas sede transformados pela renovação do vosso entendimento, para que experimenteis qual seja a boa, agradável, e perfeita vontade de Deus."],["Salmos 57:7","Preparado está o meu coração, ó Deus, preparado está o meu coração; cantarei, e darei louvores."],["Salmos 27:14","Espera no SENHOR, anima-te, e ele fortalecerá o teu coração; espera, pois, no SENHOR."],["Salmos 37:7","Descansa no SENHOR, e espera nele; não te indignes por causa daquele que prospera em seu caminho, por causa do homem que executa astutos intentos."],["Efésios 3:20","Ora, àquele que é poderoso para fazer tudo muito mais abundantemente além daquilo que pedimos ou pensamos, segundo o poder que em nós opera,"],["Filipenses 3:13","Irmãos, quanto a mim, não julgo que o haja alcançado; mas uma coisa faço, e é que, esquecendo-me das coisas que atrás ficam, e avançando para as que estão diante de mim,"],["Salmos 18:32","Deus é o que me cinge de força e aperfeiçoa o meu caminho."],["Romanos 1:16","Porque não me envergonho do evangelho de Cristo, pois é o poder de Deus para salvação de todo aquele que crê; primeiro do judeu, e também do grego."],["Provérbios 17:22","O coração alegre é como o bom remédio, mas o espírito abatido seca até os ossos."],["Isaías 41:10","Não temas, porque eu sou contigo; não te assombres, porque eu sou teu Deus; eu te fortaleço, e te ajudo, e te sustento com a destra da minha justiça."],["Isaías 43:2","Quando passares pelas águas estarei contigo, e quando pelos rios, eles não te submergirão; quando passares pelo fogo, não te queimarás, nem a chama arderá em ti."],["Salmos 1:3","Pois será como a árvore plantada junto a ribeiros de águas, a qual dá o seu fruto no seu tempo; as suas folhas não cairão, e tudo quanto fizer prosperará."],["Filipenses 4:13","Posso todas as coisas em Cristo que me fortalece."],["Salmos 25:14","O segredo do SENHOR é com aqueles que o temem; e ele lhes mostrará a sua aliança."],["1 Coríntios 13:4","O amor é sofredor, é benigno; o amor não é invejoso; o amor não trata com leviandade, não se ensoberbece."],["Isaías 30:15","Porque assim diz o Senhor DEUS, o Santo de Israel: Voltando e descansando sereis salvos; no sossego e na confiança estaria a vossa força, mas não quisestes."],["Provérbios 15:30","A luz dos olhos alegra o coração, a boa notícia fortalece os ossos."],["Salmos 1:1","BEM-AVENTURADO o homem que não anda segundo o conselho dos ímpios, nem se detém no caminho dos pecadores, nem se assenta na roda dos escarnecedores."],["Hebreus 11:6","Ora, sem fé é impossível agradar-lhe; porque é necessário que aquele que se aproxima de Deus creia que ele existe, e que é galardoador dos que o buscam."],["Salmos 34:10","Os filhos dos leões necessitam e sofrem fome, mas àqueles que buscam ao SENHOR bem nenhum faltará."],["Salmos 91:1","AQUELE que habita no esconderijo do Altíssimo, à sombra do Onipotente descansará."],["Provérbios 13:4","A alma do preguiçoso deseja, e coisa nenhuma alcança, mas a alma dos diligentes se farta."],["Provérbios 10:4","O que trabalha com mão displicente empobrece, mas a mão dos diligentes enriquece."],["Mateus 5:16","Assim resplandeça a vossa luz diante dos homens, para que vejam as vossas boas obras e gl async function loadWeather(force) {
  const city = (S.contact && S.contact.city || "").trim(); if (!city) { WX.state = "idle"; return; }
  const key = "rw-" + normCity(city);
  if (!force) { try { const c = JSON.parse(localStorage.getItem(key) || "null"); if (c && Date.now() - c.ts < 30 * 60e3) { WX.data = c; WX.state = "ok"; return updateWeatherDOM(); } } catch (e) {} }
  WX.state = "loading"; updateWeatherDOM();
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 8000);
  try {
    let geo = S.contact.geo && S.contact.geo.q === normCity(city) ? S.contact.geo : null;
    if (!geo) {
      const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city.split(",")[0].trim())}&count=1&language=pt&country_code=BR`, { signal: ctl && ctl.signal }).then(r => r.json());
      const r0 = g.results && g.results[0]; if (!r0) throw new Error("cidade não encontrada");
      geo = { q: normCity(city), lat: r0.latitude, lon: r0.longitude, name: r0.name + (r0.admin1 ? ", " + r0.admin1 : "") }; S.contact.geo = geo; persist();
    }
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`;
    const j = await fetch(u, { signal: ctl && ctl.signal }).then(r => r.json());
    WX.data = { ts: Date.now(), name: geo.name, cur: { t: j.current.temperature_2m, feel: j.current.apparent_temperature, hum: j.current.relative_humidity_2m, code: j.current.weather_code, wind: j.current.wind_speed_10m },
      daily: j.daily.time.map((d, i) => ({ d, code: j.daily.weather_code[i], max: j.daily.temperature_2m_max[i], min: j.daily.temperature_2m_min[i], pp: j.daily.precipitation_probability_max[i] })) };
    try { localStorage.setItem(key, JSON.stringify(WX.data)); } catch (e) {}
    WX.state = "ok";
  } catch (e) { WX.state = "offline"; }
  clearTimeout(to); updateWeatherDOM();
}
function updateWeatherDOM() { const el = document.getElementById("wxBox"); if (el) el.innerHTML = weatherHTML(); }
function weatherHTML() {
  const city = (S.contact && S.contact.city) || "";
  const head = `<p class="vlab">Previsão do tempo</p><form class="wxform"><input name="city" value="${esc(city)}" placeholder="Cidade, UF" aria-label="Cidade"><button class="ghost" type="submit">Buscar</button></form>`;
  const link = `<a class="lnk2" href="https://www.google.com/search?q=${encodeURIComponent("previsão do tempo " + city)}" target="_blank" rel="noopener">Ver previsão ao vivo ↗</a>`;
  if (!city) return head + `<p class="mut">Informe sua cidade para ver a previsão.</p>`;
  const dayHTML = (iso_, max, min, pp, ic) => { const d = pd(iso_); return `<div class="wxd"><b>${iso_ === iso(TODAY) ? "Hoje" : DOW[dowIdx(d)]}</b><span>${ic}</span>${Math.round(max)}°<small>${Math.round(min)}° · 💧${Math.round(pp)}%</small></div>`; };
  if (WX.state === "ok" && WX.data) {
    const d = WX.data, w = wx(d.cur.code);
    return head + `<div class="wxnow"><span class="wxic">${w[0]}</span><div><b>${Math.round(d.cur.t)}°C</b><small>${esc(w[1])} · sensação ${Math.round(d.cur.feel)}° · umid. ${d.cur.hum}% · vento ${Math.round(d.cur.wind)} km/h</small></div></div>
      <div class="wxdays">${d.daily.map(x => dayHTML(x.d, x.max, x.min, x.pp, wx(x.code)[0])).join("")}</div><small class="mut">${esc(d.name)} · atualizado às ${new Date(d.ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })} <button class="lnk" data-act="wxrefresh">↻</button></small>`;
  }
  if (WX.state === "loading") return head + `<p class="mut">Buscando previsão…</p>`;
  const match = normCity(city).startsWith(normCity(WX_SNAP.city.split(",")[0]));
  const days = match ? WX_SNAP.daily.filter(x => x[0] >= iso(TODAY)).slice(0, 5) : [];
  const fresh = match && Date.now() - new Date(WX_SNAP.ts).getTime() < 6 * 3600e3;
  return head + (days.length ? `${fresh ? `<div class="wxnow"><span class="wxic">${WX_SNAP.cur.ic}</span><div><b>${Math.round(WX_SNAP.cur.t)}°C</b><small>${WX_SNAP.cur.txt} agora</small></div></div>` : ""}
      <div class="wxdays">${days.map(x => dayHTML(x[0], x[1], x[2], x[3], ppIcon(x[3]))).join("")}</div>
      <small class="mut">Instantâneo de ${fDT(WX_SNAP.ts)} — esta hospedagem não consulta a previsão ao vivo. ${link}</small>`
    : `<p class="mut">Aqui não é possível consultar a previsão ao vivo para “${esc(city)}”.</p>${link}`);
}

/* ============ recorrência, hábitos e sessão extra ============ */
const RECS = [["weekly", "Toda semana"], ["daily", "Todos os dias"], ["biweekly", "A cada 2 semanas (quinzenal)"], ["monthly", "Todo mês"], ["once", "Uma vez só"]];

  return t + (b.until ? ` · até ${fD(pd(b.until))}` : "");
}
const sameName = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
const itemBlocks = it => S.plan.blocks.filter(b => sameName(b.item, it.name));

const HICON = { done: "✔", miss: "✖", today: "◯", plan: "○", extra: "✚", skip: "⏭", part: "◐", free: "·", none: "" };
const HTIP = { done: "Concluído (clique para desfazer)", miss: "Perdido (clique para marcar como feito)", today: "Hoje — clique para concluir", plan: "Planejado", extra: "Sessão extra (clique para desfazer)", skip: "Pulado (clique para desfazer)", part: "Parcial — clique para concluir", free: "Sem plano — clique para registrar uma sessão extra", none: "Clique para agendar neste dia" };

  for (let k = 0; k < 365; k++) { const s = habState(it, addDays(TODAY, -k)); if (s === "done" || s === "extra" || s === "part") streakN++; else if (s === "miss") break; }

  const msg = wasFocus ? `Foco concluído! 🍅 Hora da pausa (${pmMin(PM.phase)} min).` : "Pausa acabou — próxima rodada de foco!";
  try { if (window.Notification && Notification.permission === "granted") new Notification("Roadmap · Pomodoro", { body: msg }); } catch (e) {}

const IMG = { cover: "", photo: "", bg: "" }, IMG_MAX = 150000;
function PROF0() { return ({ brand: "Lu Dias Soluções Inovadoras", logo: "LUCIA DIAS", logoSub: "Soluções que conectam", msg: "Transformando ideias em soluções que conectam.", words: "Planeje\nOrganize\nRealize ♡",
  pillars: "💡 IDEIAS, ◎ ESTRATÉGIA, ♙ RESULTADOS, ▥ UM FUTURO MELHOR", insta: "", site: "", slogan: "Mais planejamento. Mais conquistas.",
  bio: "✨ Transformando ideias em soluções que conectam\n🤖 IA · Produtividade · Planejamento · Inovação\n📊 Ferramentas digitais para simplificar sua vida\n🌿 Planeje. Organize. Realize.\n🛍 Compras e varejo", coverText: true, bgOpacity: 0.18 }); }
const imgKey = n => "roadmap-img-" + n;
async function saveImg(name) {
  if (!KEY) return; const v = IMG[name];
  if (!v) { try { localStorage.removeItem(imgKey(name)); } catch (e) {} syncMark(name); if (cloudDb) { try { await cloudDb.doc("data/users/" + cloudUid + "/" + imgKey(name)).delete(); } catch (e) {} } return; }
  const rec = { ...(await encryptState(KEY, { d: v })), ts: Date.now() };
  syncMark(name);
  try { localStorage.setItem(imgKey(name), JSON.stringify(rec)); } catch (e) { toast("Sem espaço no navegador para essa imagem — use uma menor."); }
  if (cloudDb) { try { await cloudDb.doc("data/users/" + cloudUid + "/" + imgKey(name)).set(rec); } catch (e) {} }
}
async function loadImgs() {
  if (DEMO) return;
  for (const n of ["cover", "photo", "bg"]) {
    try {
      let rec = null; try { rec = JSON.parse(localStorage.getItem(imgKey(n)) || "null"); } catch (e) {}
      if (cloudDb) { try { const sn = await cloudDb.doc("data/users/" + cloudUid + "/" + imgKey(n)).get(); if (sn.exists) { const c = JSON.parse(JSON.stringify(sn.data())); if (!rec || (c.ts || 0) >= (rec.ts || 0)) rec = c; } } catch (e) {} }
      IMG[n] = rec ? (await decryptState(KEY, rec)).d : "";
    } catch (e) { IMG[n] = ""; }
  }
  applyBg(); if (auth === "app") render();
}
function applyBg() {
  let el = document.getElementById("bgimg"); if (!el) { el = document.createElement("div"); el.id = "bgimg"; document.body.insertBefore(el, document.body.firstChild); }
  const on = auth === "app" && IMG.bg; el.style.backgroundImage = on ? `url(${IMG.bg})` : "none"; el.style.opacity = on ? String((S.profile && S.profile.bgOpacity) || 0.18) : "0";
}
function resizeImage(file, w, h, crop) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url); let tw = w, th = h, sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (crop) { const ar = w / h; if (sw / sh > ar) { sw = sh * ar; sx = (img.width - sw) / 2; } else { sh = sw / ar; sy = (img.height - sh) / 2; } }
      else { const k = Math.min(1, w / sw, h / sh); tw = Math.round(sw * k); th = Math.round(sh * k); }
      let q = .85, scale = 1, out = "";
      for (let i = 0; i < 14; i++) { const c = document.createElement("canvas"); c.width = Math.round(tw * scale); c.height = Math.round(th * scale); c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q); if (out.length <= IMG_MAX) return res(out); if (q > .5) q -= .1; else scale *= .85; }
      rej(new Error("grande demais"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagem inválida")); }; img.src = url;
  });
}

    <div class="prof-bio">${bio.map(b => `<div>${esc(b)}</div>`).join("")}</div>
    <div class="prof-btn"><button class="pri" data-nav="planner">📊 Meu planejador</button><button class="ghost" data-act="editprofile">✎ Editar perfil</button><button class="ghost" data-act="pals">🎨 Cores</button></div></div></div></section>`;

      <label class="f" style="margin-top:6px">Intensidade do fundo<input type="range" name="bgOpacity" min="0.05" max="0.6" step="0.01" value="${P.bgOpacity}"></label></div>

/* ajusta o tamanho do número para caber inteiro no quadro do indicador */
function fitKpis() {
  document.querySelectorAll(".kpis").forEach(g => {
    const vs = [...g.querySelectorAll(".kpi .v")]; if (!vs.length) return;
    vs.forEach(el => { el.style.fontSize = ""; });
    let min = Infinity;
    vs.forEach(el => { let f = parseFloat(getComputedStyle(el).fontSize) || 26; while (el.scrollWidth > el.clientWidth + 0.5 && f > 11) { f -= 0.5; el.style.fontSize = f + "px"; } min = Math.min(min, f); });
    vs.forEach(el => { el.style.fontSize = min + "px"; });   // todos os números do grupo com o mesmo tamanho
  });
}
{ const _render = render; render = function () { const x = _render.apply(this, arguments); try { fitKpis(); } catch (er) {} return x; }; }
window.addEventListener("resize", () => { clearTimeout(fitKpis._t); fitKpis._t = setTimeout(fitKpis, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { try { fitKpis(); } catch (er) {} });

boot();
